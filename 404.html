<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sahifa topilmadi — ABUELECTRIC</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  body { min-height: 100vh; display: grid; place-items: center; text-align: center;
         background: linear-gradient(180deg, var(--green-900), var(--green-950)); color: #fff; padding: 24px; }
  .code { font: 700 clamp(72px, 18vw, 160px)/1 var(--display); color: var(--volt); letter-spacing: -.04em; }
  p { color: rgba(255,255,255,.7); margin: 12px 0 32px; }
</style>
</head>
<body>
  <div>
    <div class="code">4⚡4</div>
    <h1 style="font-size:28px;margin-top:16px">Bu yerda tok yo'q</h1>
    <p>Siz qidirgan sahifa topilmadi yoki ko'chirilgan.</p>
    <a class="btn btn-volt" href="/">Bosh sahifaga qaytish</a>
  </div>
<script>
  // abuelectric.uz/u/<id> ulashish havolasi (Render rewrite sozlanmagan bo'lsa ham) → usta profili
  (function () { var m = location.pathname.match(/^\/u\/([A-Za-z0-9]{6,64})\/?$/); if (m) location.replace('/usta/?id=' + m[1]); })();
</script>
</body>
</html>
